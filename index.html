<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wisnu Ratya | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Montserrat',sans-serif;
    scroll-behavior:smooth;
}

body{
    background:#0f0f14;
    color:#ffffff;
}

/* ================= NAVBAR ================= */
nav{
    position:fixed;
    top:0;
    width:100%;
    padding:20px 0;
    display:flex;
    justify-content:center;
    transition:0.4s;
    z-index:1000;
}

nav.scrolled{
    background:#111118;
    box-shadow:0 5px 20px rgba(255,0,150,0.2);
}

nav ul{
    list-style:none;
    display:flex;
    gap:50px;
}

nav ul li a{
    text-decoration:none;
    color:#aaa;
    font-weight:500;
    letter-spacing:1px;
    transition:0.3s;
}

nav ul li a:hover{
    color:#ff2ea6;
}

/* ================= SECTION ================= */
section{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:120px 20px;
    opacity:0;
    transform:translateY(60px);
    transition:all 1s ease;
}

section.show{
    opacity:1;
    transform:translateY(0);
}

/* ================= CARD ================= */
.card{
    width:950px;
    padding:60px;
    background:#16161f;
    border-radius:20px;
    box-shadow:0 0 40px rgba(255,0,150,0.15);
}

/* ================= PROFIL ================= */
.profile-container{
    display:flex;
    align-items:center;
    gap:60px;
}

.profile-img{
    width:220px;
    height:220px;
    border-radius:50%;
    border:4px solid #ff2ea6;
    object-fit:cover;
    cursor:pointer;
    transition:0.4s;
}

.profile-img:hover{
    box-shadow:0 0 30px #ff2ea6;
    transform:scale(1.05);
}

.info h1{
    font-size:32px;
    margin-bottom:20px;
    color:#ff2ea6;
}

.info p{
    margin:10px 0;
    font-size:16px;
    color:#ccc;
}

.info span{
    color:#ffffff;
    font-weight:600;
}

/* ================= KONTAK ================= */
.social{
    text-align:center;
}

.social a{
    display:inline-block;
    margin:15px;
    padding:14px 28px;
    border-radius:50px;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    color:#0f0f14;
    background:#ff2ea6;
    transition:0.3s;
}

.social a:hover{
    background:#ffffff;
    color:#ff2ea6;
    transform:translateY(-5px);
}

/* ================= MAP ================= */
iframe{
    width:100%;
    height:400px;
    border:none;
    border-radius:20px;
    filter:grayscale(100%) contrast(110%);
}

/* ================= MODAL ================= */
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.95);
    z-index:2000;
    justify-content:center;
    align-items:center;
}

.modal img{
    max-width:60%;
    border-radius:20px;
}

.close{
    position:absolute;
    top:40px;
    right:60px;
    font-size:40px;
    color:#ff2ea6;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav id="navbar">
    <ul>
        <li><a href="#profil">PROFIL</a></li>
        <li><a href="#kontak">KONTAK</a></li>
        <li><a href="#maps">LOKASI</a></li>
    </ul>
</nav>

<!-- PROFIL -->
<section id="profil">
    <div class="card">
        <div class="profile-container">
            <img src="pp.jpeg" class="profile-img" id="profileImage">
            <div class="info">
                <h1>I Gede Wisnu Ratya Naratama</h1>
                <p><span>Usia:</span> 20 Tahun</p>
                <p><span>Alamat:</span> Batubulan, Bali</p>
                <p><span>Jurusan:</span> Informatika</p>
                <p><span>Kampus:</span> UHN I Gusti Bagus Sugriwa</p>
            </div>
        </div>
    </div>
</section>

<!-- KONTAK -->
<section id="kontak">
    <div class="card">
        <h1 style="text-align:center;margin-bottom:40px;color:#ff2ea6;">Connect With Me</h1>
        <div class="social">
            <a href="https://instagram.com/wisnoern" target="_blank">Instagram</a>
            <a href="https://www.facebook.com/share/17hmcHNM3K/" target="_blank">Facebook</a>
            <a href="https://wa.me/6281238997725" target="_blank">WhatsApp</a>
        </div>
    </div>
</section>

<!-- MAP -->
<section id="maps">
    <div class="card">
        <h1 style="text-align:center;margin-bottom:40px;color:#ff2ea6;">My Location</h1>
        <iframe src="https://maps.google.com/maps?q=Batubulan%20Kangin,%20Sukawati&t=&z=15&ie=UTF8&iwloc=&output=embed"></iframe>
    </div>
</section>

<!-- MODAL -->
<div class="modal" id="imageModal">
    <span class="close" id="closeModal">&times;</span>
    <img id="modalImg">
</div>

<script>
// Navbar scroll effect
window.addEventListener("scroll",function(){
    const nav=document.getElementById("navbar");
    nav.classList.toggle("scrolled",window.scrollY>50);
});

// Fade-in animation
const sections=document.querySelectorAll("section");
window.addEventListener("scroll",function(){
    sections.forEach(sec=>{
        const top=sec.getBoundingClientRect().top;
        if(top<window.innerHeight-100){
            sec.classList.add("show");
        }
    });
});

// Modal foto
const img=document.getElementById("profileImage");
const modal=document.getElementById("imageModal");
const modalImg=document.getElementById("modalImg");
const closeModal=document.getElementById("closeModal");

img.onclick=function(){
    modal.style.display="flex";
    modalImg.src=this.src;
}

closeModal.onclick=function(){
    modal.style.display="none";
}

modal.onclick=function(e){
    if(e.target===modal){
        modal.style.display="none";
    }
}
</script>

</body>
</html>
