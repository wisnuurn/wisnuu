<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wisnu Ratya | Portfolio</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Montserrat',sans-serif;
    scroll-behavior:smooth;
}

body{
    background:#0f0f14;
    color:#ffffff;
}

/* ================= NAVBAR ================= */
nav{
    position:fixed;
    top:0;
    width:100%;
    padding:20px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:1000;
    transition:0.4s;
}

nav.scrolled{
    background:#111118;
    box-shadow:0 5px 20px rgba(255,0,150,0.2);
}

.logo{
    font-weight:700;
    color:#ff2ea6;
    font-size:18px;
}

nav ul{
    list-style:none;
    display:flex;
    gap:40px;
}

nav ul li a{
    text-decoration:none;
    color:#aaa;
    transition:0.3s;
}

nav ul li a:hover{
    color:#ff2ea6;
}

/* HAMBURGER */
.menu-toggle{
    display:none;
    flex-direction:column;
    cursor:pointer;
}

.menu-toggle span{
    height:3px;
    width:25px;
    background:#ff2ea6;
    margin:4px 0;
}

/* ================= SECTION ================= */
section{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:120px 20px;
    opacity:0;
    transform:translateY(60px);
    transition:1s;
}

section.show{
    opacity:1;
    transform:translateY(0);
}

/* ================= CARD ================= */
.card{
    width:100%;
    max-width:1000px;
    padding:50px;
    background:#16161f;
    border-radius:20px;
    box-shadow:0 0 40px rgba(255,0,150,0.15);
}

/* ================= PROFIL ================= */
.profile-container{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:60px;
}

.profile-img{
    width:220px;
    height:220px;
    border-radius:50%;
    border:4px solid #ff2ea6;
    object-fit:cover;
    transition:0.4s;
}

.profile-img:hover{
    box-shadow:0 0 30px #ff2ea6;
    transform:scale(1.05);
}

.info h1{
    font-size:32px;
    margin-bottom:20px;
    color:#ff2ea6;
}

.info p{
    margin:10px 0;
    color:#ccc;
}

.info span{
    color:#fff;
    font-weight:600;
}

/* ================= KONTAK ================= */
.social{
    text-align:center;
}

.social a{
    display:inline-block;
    margin:15px;
    padding:14px 28px;
    border-radius:50px;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    color:#0f0f14;
    background:#ff2ea6;
    transition:0.3s;
}

.social a:hover{
    background:#ffffff;
    color:#ff2ea6;
    transform:translateY(-5px);
}

/* ================= MAP ================= */
iframe{
    width:100%;
    height:350px;
    border:none;
    border-radius:20px;
    filter:grayscale(100%) contrast(110%);
}

/* ================= RESPONSIVE ================= */
@media(max-width:900px){
    .profile-container{
        flex-direction:column;
        text-align:center;
    }

    .profile-img{
        width:180px;
        height:180px;
    }
}

@media(max-width:768px){
    nav ul{
        position:absolute;
        top:70px;
        right:30px;
        background:#16161f;
        flex-direction:column;
        gap:20px;
        padding:20px;
        border-radius:10px;
        display:none;
    }

    nav ul.active{
        display:flex;
    }

    .menu-toggle{
        display:flex;
    }
}
</style>
</head>

<body>

<nav id="navbar">
    <div class="logo">Wisnu</div>
    <ul id="navLinks">
        <li><a href="#profil">Profil</a></li>
        <li><a href="#kontak">Kontak</a></li>
        <li><a href="#maps">Lokasi</a></li>
    </ul>
    <div class="menu-toggle" id="menuToggle">
        <span></span>
        <span></span>
        <span></span>
    </div>
</nav>

<section id="profil">
    <div class="card">
        <div class="profile-container">
            <img src="pp.jpeg" class="profile-img">
            <div class="info">
                <h1>I Gede Wisnu Ratya Naratama</h1>
                <p><span>Usia:</span> 20 Tahun</p>
                <p><span>Lokasi:</span> Batubulan, Bali</p>
                <p><span>Jurusan:</span> Informatika</p>
                <p><span>Kampus:</span> UHN I Gusti Bagus Sugriwa</p>
            </div>
        </div>
    </div>
</section>

<section id="kontak">
    <div class="card">
        <h1 style="text-align:center;margin-bottom:40px;color:#ff2ea6;">Connect With Me</h1>
        <div class="social">
            <a href="https://instagram.com/wisnoern" target="_blank">Instagram</a>
            <a href="https://www.facebook.com/share/17hmcHNM3K/" target="_blank">Facebook</a>
            <a href="https://wa.me/6281238997725" target="_blank">WhatsApp</a>
        </div>
    </div>
</section>

<section id="maps">
    <div class="card">
        <h1 style="text-align:center;margin-bottom:40px;color:#ff2ea6;">My Location</h1>
        <iframe src="https://maps.google.com/maps?q=Batubulan%20Kangin,%20Sukawati&t=&z=15&ie=UTF8&iwloc=&output=embed"></iframe>
    </div>
</section>

<script>
// Navbar scroll effect
window.addEventListener("scroll",function(){
    document.getElementById("navbar")
    .classList.toggle("scrolled",window.scrollY>50);
});

// Fade-in effect
const sections=document.querySelectorAll("section");
window.addEventListener("scroll",function(){
    sections.forEach(sec=>{
        const top=sec.getBoundingClientRect().top;
        if(top<window.innerHeight-100){
            sec.classList.add("show");
        }
    });
});

// Hamburger toggle
const toggle=document.getElementById("menuToggle");
const navLinks=document.getElementById("navLinks");

toggle.addEventListener("click",()=>{
    navLinks.classList.toggle("active");
});
</script>

</body>
</html>
